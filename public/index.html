<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト用紙メーカー — Gemini製 学校テスト作成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg-0: #070707;
    --bg-1: #0b0b0b;
    --panel: #121212;
    --panel-alt: #171717;
    --border: #2c2c2c;
    --border-soft: #1e1e1e;
    --ink: #f5f5f5;
    --ink-soft: #9a9a9a;
    --ink-faint: #666666;
    --accent: #ffffff;
    --accent-2: #c9c9c9;
    --accent-glow: rgba(255,255,255,0.18);
    --danger: #ff6b6b;
    --paper: #ffffff;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(880px 480px at 12% -8%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(760px 460px at 100% 0%, rgba(255,255,255,0.04), transparent 55%),
      var(--bg-0);
    color: var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
  }

  .topbar{
    padding: 20px 28px;
    border-bottom: 1px solid var(--border-soft);
  }
  .topbar h1{ font-size: 15px; font-weight:700; margin:0; letter-spacing:0.01em; }

  .layout{
    display:grid;
    grid-template-columns: 400px 1fr;
    gap: 26px;
    max-width: 1320px;
    margin: 28px auto;
    padding: 0 24px 60px;
    align-items:start;
  }
  @media (max-width: 980px){ .layout{ grid-template-columns: 1fr; } }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
  }

  .control-panel{ position: sticky; top: 20px; padding: 26px; }
  .section-title{
    font-size: 11px; font-weight:700; letter-spacing:0.06em;
    color: var(--ink-soft);
    margin: 26px 0 13px;
  }
  .section-title:first-child{ margin-top:0; }
  .section-hint{ font-size: 11px; color: var(--ink-faint); margin: -8px 0 12px; line-height:1.6; }

  .field{ margin-bottom: 14px; }
  .field label{ display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; font-weight:600; color: var(--ink-soft); margin-bottom:6px; }
  .field label .opt{ font-family:'Zen Kaku Gothic New', sans-serif; font-size:9.5px; color: var(--ink-faint); font-weight:400; }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%; font-family:'Zen Kaku Gothic New', sans-serif; font-size:13.5px; color: var(--ink);
    background: #0d0f16; border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; outline:none; transition: border-color .12s ease, box-shadow .12s ease;
  }
  .field textarea{ resize:vertical; min-height:64px; line-height:1.6; font-family:'Zen Kaku Gothic New', sans-serif; }
  .field textarea.tall{ min-height: 100px; }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,0.14);
  }
  .field select{ appearance:none; background-image:
    linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
    linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .row2{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color: var(--ink); margin-bottom: 12px;
    padding: 10px 12px; background:#0d0f16; border:1px solid var(--border); border-radius:9px;
  }
  .switch{ position:relative; width:38px; height:22px; flex:none; }
  .switch input{ opacity:0; width:0; height:0; position:absolute; }
  .switch .track{
    position:absolute; inset:0; background:#262a38; border-radius:999px; transition:.15s;
  }
  .switch .track::after{
    content:""; position:absolute; top:2px; left:2px; width:18px; height:18px;
    background:#8b91a5; border-radius:50%; transition:.15s;
  }
  .switch input:checked + .track{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .switch input:checked + .track::after{ transform: translateX(16px); background:#fff; }

  .generate-btn{
    width:100%; margin-top: 20px;
    font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size:14.5px;
    color:#0a0a0a; background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border:none; border-radius: 11px; padding: 14px; cursor:pointer;
    box-shadow: none;
    transition: transform .08s ease, opacity .12s ease;
  }
  .generate-btn:hover{ opacity:.9; }
  .generate-btn:active{ transform: translateY(0px); }
  .generate-btn:disabled{ opacity:.4; cursor:default; transform:none; box-shadow:none; }

  .status-msg{ font-size:12.5px; color: var(--ink-soft); margin-top: 10px; min-height: 16px; }
  .status-msg.error{ color: var(--danger); font-weight:700; }

  .loading-line{ display:none; align-items:center; gap:8px; font-size:12px; color: var(--ink-faint); margin-top:10px; font-family:'Zen Kaku Gothic New', sans-serif; }
  .loading-line.active{ display:flex; }
  .pencil-track{ position:relative; width:80px; height:2px; background: var(--border); overflow:hidden; border-radius:2px; }
  .pencil-track::after{
    content:""; position:absolute; top:0; left:-40%; width:40%; height:100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2)); animation: scribble 1.1s ease-in-out infinite;
  }
  @keyframes scribble{ 0%{ left:-40%; } 50%{ left:100%; } 100%{ left:-40%; } }

  .font-note{
    margin-top: 22px; font-size: 10.5px; line-height:1.7; color: var(--ink-faint);
    background: #0d0f16; border: 1px solid var(--border-soft); border-radius: 9px; padding: 10px 12px;
  }

  /* --- Preview column --- */
  .preview-stage{
    background: #050505;
    border: 1px solid var(--border);
    border-radius: 0;
    padding: 32px;
    display:flex; justify-content:center;
  }

  .export-panel{
    display:flex; gap: 14px; margin-top: 14px;
  }
  .export-box{
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px 22px;
    flex: 1;
  }
  .export-title{ font-size: 14.5px; font-weight:700; margin: 0 0 8px; }
  .export-summary{ font-size: 12px; color: var(--ink-soft); }
  .export-list{ display:flex; flex-direction:column; gap: 10px; }
  .export-item{
    text-align:left; background:transparent; border:none; padding:0;
    font-family:'Zen Kaku Gothic New', sans-serif; font-size: 13.5px; color: var(--ink);
    cursor:pointer;
  }
  .export-item::before{ content:"・"; }
  .export-item:hover:not(:disabled){ text-decoration: underline; }
  .export-item:disabled{ color: var(--ink-faint); cursor:default; }

  .paper-page{
    width: 210mm;
    min-height: 297mm;
    max-width: 100%;
    background: var(--paper);
    box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03);
    padding: 16mm 16mm 18mm;
    font-family:'Kaisei Decol', serif;
    color:#1a1a1a;
  }

  .paper-header{
    display:flex; justify-content:space-between; align-items:flex-start;
    border-bottom: 2px solid #1a1a1a; padding-bottom: 10px; margin-bottom: 16px;
  }
  .paper-header .school{ font-size: 11px; color:#444; margin:0 0 6px; }
  .paper-header .subject-title{ font-size: 24px; font-weight:700; margin:0; letter-spacing:0.06em; }
  .paper-header .meta{ font-size: 10.5px; color:#555; margin-top:6px; }
  .score-box{
    border: 1.5px solid #1a1a1a; border-radius: 4px;
    padding: 8px 14px; text-align:center; min-width: 120px;
  }
  .score-box .cap{ font-size:10px; color:#555; }
  .score-box .val{ font-size:18px; font-weight:700; margin-top:2px; }

  .id-row{ display:flex; gap: 18px; font-size: 12px; color:#333; margin-bottom: 18px; }
  .id-row .id-field{ display:flex; align-items:baseline; gap:6px; }
  .id-row .id-field .u-line{ display:inline-block; width: 90px; border-bottom: 1px solid #888; height: 14px; }
  .id-row .id-field.name .u-line{ width: 140px; }

  .instructions{
    font-size: 10.5px; color:#555; border: 1px dashed #bbb; border-radius:4px;
    padding: 6px 10px; margin-bottom: 20px; line-height:1.7;
  }

  .q-block{ margin-bottom: 20px; page-break-inside: avoid; }
  .q-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .q-num{ font-weight:700; font-size:14.5px; flex:none; }
  .q-points{ font-size:11px; color:#666; flex:none; }
  .q-text{ font-size: 14.5px; line-height:1.85; flex:1; }

  .mc-options{ list-style:none; margin: 8px 0 4px 26px; padding:0; display:flex; flex-direction:column; gap:6px; }
  .mc-options li{ font-size:13.5px; line-height:1.7; }
  .mc-options li .kana{ font-weight:700; margin-right:8px; }
  .mc-answer-blank{ margin: 6px 0 0 26px; font-size:12.5px; color:#333; }
  .mc-answer-blank .box{
    display:inline-block; width:26px; height:20px; border:1.3px solid #333;
    border-radius:3px; vertical-align:middle; margin-left:6px;
  }

  .desc-lines{ margin: 8px 0 0 26px; }
  .desc-lines .l{ border-bottom: 1px solid #999; height: 22px; }
  .calc-blank{
    display:inline-block; width: 110px; height: 1.1em;
    border-bottom: 1.3px solid #333; margin-left: 10px; vertical-align: middle;
  }

  .answer-sheet{ margin-top: 26px; page-break-before: always; }
  .answer-sheet h2{ font-size:16px; border-bottom:2px solid #1a1a1a; padding-bottom:6px; margin-bottom:14px; }
  .a-row{ display:flex; gap:12px; font-size:13px; margin-bottom:10px; align-items:baseline; }
  .a-row .a-num{ font-weight:700; flex:none; width:32px; }
  .a-row .a-ans{ font-weight:700; }
  .a-row .a-exp{ color:#555; font-size:12px; margin-top:2px; }

  .empty-preview{
    min-height: 500px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    text-align:center; background: var(--panel); border:1px solid var(--border);
  }
  .empty-preview .big{ font-size: 44px; font-weight:700; color: var(--ink); letter-spacing:0.05em; }
  .empty-preview .hint{ font-size: 12.5px; color: var(--ink-faint); line-height:1.9; }

  @media print{
    body *{ visibility:hidden; }
    .paper-page, .paper-page *{ visibility:visible; }
    .paper-page{ position:absolute; top:0; left:0; box-shadow:none; padding:14mm 14mm 16mm; width:auto; min-height:0; }
    .preview-stage{ padding:0; background:none; border:none; }
  }
  @page{ size: A4; margin: 0; }
</style>
</head>
<body>

<div class="topbar">
  <h1>プリント作成ツール</h1>
</div>

<div class="layout">

  <!-- 左: 作成フォーム -->
  <div class="panel control-panel">
    <form id="genForm">

      <div class="section-title">基本設定</div>
      <div class="row2">
        <div class="field">
          <label for="subject">教科</label>
          <input type="text" id="subject" placeholder="例：理科" value="理科">
        </div>
        <div class="field">
          <label for="grade">対象学年</label>
          <input type="text" id="grade" placeholder="例：中学2年" value="中学2年">
        </div>
      </div>
      <div class="field">
        <label for="topic">出題範囲・テーマ <span class="opt" style="color:var(--danger)">required</span></label>
        <textarea id="topic" placeholder="例：電流とオームの法則、光合成と呼吸、江戸時代の産業と交通 など"></textarea>
      </div>
      <div class="row3">
        <div class="field">
          <label for="format">出題形式</label>
          <select id="format">
            <option value="mixed">選択式・記述式・計算問題を混在</option>
            <option value="mc">選択式のみ</option>
            <option value="desc">記述式のみ</option>
            <option value="calc">計算問題（穴埋め式）のみ</option>
          </select>
        </div>
        <div class="field">
          <label for="difficulty">難易度</label>
          <select id="difficulty">
            <option value="easy">やさしい</option>
            <option value="normal" selected>標準</option>
            <option value="hard">難しい</option>
          </select>
        </div>
        <div class="field">
          <label for="count">問題数</label>
          <input type="number" id="count" value="8" min="1" max="20">
        </div>
      </div>
      <div class="field">
        <label for="totalPoints">配点合計</label>
        <input type="number" id="totalPoints" value="100" min="1" max="200">
      </div>

      <div class="section-title">Geminiへの追加指示</div>
      <div class="section-hint">教科書の本文を貼り付けたり、細かい要望を書くほど出題の精度が上がります。</div>
      <div class="field">
        <label for="referenceText">参考文章 <span class="opt">optional</span></label>
        <textarea class="tall" id="referenceText" placeholder="教科書やプリントの該当箇所をそのまま貼り付けると、その内容に基づいて出題します"></textarea>
      </div>
      <div class="field">
        <label for="sampleProblems">出題例（この形式・レベル感に合わせる） <span class="opt">optional</span></label>
        <textarea class="tall" id="sampleProblems" placeholder="例：&#10;3x+5x=&#10;12+15x+3-7x="></textarea>
      </div>
      <div class="field">
        <label for="keywords">必ず含めたいキーワード <span class="opt">optional</span></label>
        <input type="text" id="keywords" placeholder="例：電圧, 電流, オームの法則（カンマ区切り）">
      </div>
      <div class="field">
        <label for="extraInstructions">自由記述の指示 <span class="opt">optional</span></label>
        <textarea id="extraInstructions" placeholder="例：計算問題を2問以上入れる／図やグラフを前提とする問題は避ける／文末は「〜しなさい」で統一 など"></textarea>
      </div>

      <div class="section-title">用紙のヘッダー情報</div>
      <div class="row2">
        <div class="field">
          <label for="schoolName">学校名 <span class="opt">optional</span></label>
          <input type="text" id="schoolName" placeholder="例：〇〇中学校">
        </div>
        <div class="field">
          <label for="examDate">実施日 <span class="opt">optional</span></label>
          <input type="text" id="examDate" placeholder="例：2026年9月10日">
        </div>
      </div>
      <label class="toggle-row">
        解答・採点基準ページを付ける（教員用）
        <span class="switch">
          <input type="checkbox" id="includeAnswerSheet" checked>
          <span class="track"></span>
        </span>
      </label>

      <button type="submit" class="generate-btn" id="genBtn">テスト用紙を作成する</button>
      <div class="loading-line" id="loadingLine">
        <span class="pencil-track"></span><span>作成中…</span>
      </div>
      <div class="status-msg" id="statusMsg"></div>

      <div class="font-note">
        ※ 本物の「教科書体」（UD デジタル教科書体など）は商用フォントのため組み込めません。教科書体を意識してデザインされた無料フォント「Kaisei Decol」を試験用紙本文に使用しています。
      </div>
    </form>
  </div>

  <!-- 右: プレビュー -->
  <div>
    <div class="preview-stage">
      <div id="paperArea">
        <div class="empty-preview" style="width:210mm;max-width:100%;">
          <div class="big">プレビュー</div>
          <div class="hint">左のフォームに出題範囲を入力して「テスト用紙を作成する」を押すと、<br>ここにA4サイズの試験用紙が表示されます。</div>
        </div>
      </div>
    </div>

    <div class="export-panel">
      <div class="export-box">
        <div class="export-title">エクスポート</div>
        <div class="export-summary" id="previewLabel">作成するとここに反映されます</div>
      </div>
      <div class="export-box export-list">
        <button class="export-item" id="printBtn" disabled>PDFとして保存</button>
        <button class="export-item" id="docxBtn" disabled>Word（.docx）</button>
        <button class="export-item" id="odtBtn" disabled>LibreOffice（.odt）</button>
        <button class="export-item" id="pngBtn" disabled>PNG画像</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const form = document.getElementById('genForm');
  const genBtn = document.getElementById('genBtn');
  const loadingLine = document.getElementById('loadingLine');
  const statusMsg = document.getElementById('statusMsg');
  const paperArea = document.getElementById('paperArea');
  const printBtn = document.getElementById('printBtn');
  const docxBtn = document.getElementById('docxBtn');
  const odtBtn = document.getElementById('odtBtn');
  const pngBtn = document.getElementById('pngBtn');
  const previewLabel = document.getElementById('previewLabel');
  let lastQuestions = null;
  let lastOpts = null;

  // 万一Gemini側の指示が漏れてLaTeX記法が混じった場合の保険的な変換
  function cleanMath(str){
    let s = String(str == null ? '' : str);
    s = s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g, '$1/$2'); // \frac{a}{b} -> a/b
    s = s.replace(/\\sqrt\{([^{}]*)\}/g, '√$1');                // \sqrt{a} -> √a
    s = s.replace(/\\times/g, '×');
    s = s.replace(/\\cdot/g, '×');
    s = s.replace(/\\pi/g, 'π');
    s = s.replace(/\^\{([^{}]*)\}/g, '^$1');                    // ^{2} -> ^2
    s = s.replace(/\\\(|\\\)|\\\[|\\\]/g, '');                  // \( \) \[ \]
    s = s.replace(/\$\$?/g, '');                                // $ や $$ を除去
    s = s.replace(/\\{1,2}(?![a-zA-Z])/g, '');                  // 孤立したバックスラッシュを除去
    return s;
  }

  function escapeHtml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  const KANA = ['ア','イ','ウ','エ','オ','カ'];

  function setLoading(v){
    genBtn.disabled = v;
    loadingLine.classList.toggle('active', v);
  }
  function showStatus(text, isError){
    statusMsg.textContent = text || '';
    statusMsg.classList.toggle('error', !!isError);
  }

  function renderPaper(questions, opts){
    const subject = opts.subject || 'テスト';
    const grade = opts.grade || '';
    const school = opts.schoolName || '';
    const date = opts.examDate || '';
    const totalPoints = opts.totalPoints;
    const includeAnswers = opts.includeAnswerSheet;

    let qHtml = '';
    questions.forEach((q, i) => {
      const num = i + 1;
      const isMC = q.type === 'multiple_choice' && Array.isArray(q.options) && q.options.length > 0;
      const isCalc = q.type === 'calculation';
      qHtml += `<div class="q-block">
        <div class="q-head">
          <span class="q-num">問${num}</span>
          <span class="q-points">(${q.points || '-'}点)</span>
          <span class="q-text">${escapeHtml(cleanMath(q.question))}${isCalc ? '<span class="calc-blank"></span>' : ''}</span>
        </div>`;
      if (isMC) {
        qHtml += '<ul class="mc-options">' + q.options.map((opt, oi) =>
          `<li><span class="kana">${KANA[oi] || (oi+1)}</span>${escapeHtml(cleanMath(opt))}</li>`
        ).join('') + '</ul>';
        qHtml += `<div class="mc-answer-blank">答え<span class="box"></span></div>`;
      } else if (!isCalc) {
        const lines = q.answerLength === 'long' ? 4 : 2;
        qHtml += '<div class="desc-lines">' + Array.from({length: lines}).map(() => '<div class="l"></div>').join('') + '</div>';
      }
      qHtml += `</div>`;
    });

    let answerHtml = '';
    if (includeAnswers) {
      answerHtml = `<div class="answer-sheet"><h2>解答・採点基準（教員用）</h2>` +
        questions.map((q, i) => `
          <div class="a-row">
            <span class="a-num">問${i+1}</span>
            <div>
              <div class="a-ans">${escapeHtml(cleanMath(q.answer))}</div>
              <div class="a-exp">${escapeHtml(cleanMath(q.explanation || ''))}</div>
            </div>
          </div>
        `).join('') + `</div>`;
    }

    return `
      <div class="paper-page">
        <div class="paper-header">
          <div>
            ${school ? `<p class="school">${escapeHtml(school)}</p>` : ''}
            <p class="subject-title">${escapeHtml(subject)}　テスト</p>
            <p class="meta">${escapeHtml(grade)}${grade && date ? '　' : ''}${escapeHtml(date)}</p>
          </div>
          <div class="score-box">
            <div class="cap">得点</div>
            <div class="val">　　　／ ${totalPoints}点</div>
          </div>
        </div>
        <div class="id-row">
          <div class="id-field"><span>組</span><span class="u-line"></span></div>
          <div class="id-field"><span>番</span><span class="u-line"></span></div>
          <div class="id-field name"><span>氏名</span><span class="u-line"></span></div>
        </div>
        <div class="instructions">・字は丁寧に、はっきりと書きましょう。　・見直しの時間を大切に。</div>
        ${qHtml}
        ${answerHtml}
      </div>
    `;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showStatus('');

    const subject = document.getElementById('subject').value.trim();
    const grade = document.getElementById('grade').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const format = document.getElementById('format').value;
    const difficulty = document.getElementById('difficulty').value;
    const count = Math.min(20, Math.max(1, parseInt(document.getElementById('count').value, 10) || 8));
    const totalPoints = Math.min(200, Math.max(1, parseInt(document.getElementById('totalPoints').value, 10) || 100));
    const referenceText = document.getElementById('referenceText').value.trim();
    const sampleProblems = document.getElementById('sampleProblems').value.trim();
    const keywords = document.getElementById('keywords').value.trim();
    const extraInstructions = document.getElementById('extraInstructions').value.trim();
    const schoolName = document.getElementById('schoolName').value.trim();
    const examDate = document.getElementById('examDate').value.trim();
    const includeAnswerSheet = document.getElementById('includeAnswerSheet').checked;

    if (!topic) {
      showStatus('出題範囲・テーマを入力してください。', true);
      document.getElementById('topic').focus();
      return;
    }

    setLoading(true);
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subject, grade, topic, format, difficulty, count, totalPoints,
          referenceText, sampleProblems, keywords, extraInstructions
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `サーバーエラー (${res.status})`);

      const questions = data.questions || [];
      const opts = { subject, grade, schoolName, examDate, totalPoints, includeAnswerSheet };
      paperArea.innerHTML = renderPaper(questions, opts);
      lastQuestions = questions;
      lastOpts = opts;
      printBtn.disabled = false;
      docxBtn.disabled = false;
      odtBtn.disabled = false;
      pngBtn.disabled = false;
      previewLabel.textContent = `全${questions.length}問・${totalPoints}点満点`;
      showStatus(`${questions.length}問 作成しました。`);
    } catch (err) {
      console.error(err);
      showStatus(err.message || 'テスト用紙の作成に失敗しました。', true);
    } finally {
      setLoading(false);
    }
  });

  function downloadBlob(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // Word(.docx) / LibreOffice(.odt) 共通で使う文書構造モデルを作る
  function buildContentModel(questions, opts){
    const model = [];
    if (opts.schoolName) model.push({ text: opts.schoolName, style: 'Meta' });
    model.push({ text: `${opts.subject || 'テスト'}　テスト`, style: 'Title' });
    const metaText = [opts.grade, opts.examDate].filter(Boolean).join('　');
    if (metaText) model.push({ text: metaText, style: 'Meta' });
    model.push({ text: `得点：　　　　／ ${opts.totalPoints}点`, style: 'Score' });
    model.push({ text: '組（　　） 番（　　） 氏名（　　　　　　　　　　）', style: 'Normal' });
    model.push({ text: '・字は丁寧に、はっきりと書きましょう。　・見直しの時間を大切に。', style: 'Meta' });

    questions.forEach((q, i) => {
      const isMC = q.type === 'multiple_choice' && Array.isArray(q.options) && q.options.length > 0;
      const isCalc = q.type === 'calculation';
      const qText = `問${i + 1}　(${q.points || '-'}点)　${cleanMath(q.question)}${isCalc ? '　＿＿＿＿＿＿＿＿' : ''}`;
      model.push({ text: qText, style: 'Question' });
      if (isMC) {
        q.options.forEach((opt, oi) => {
          model.push({ text: `　${KANA[oi] || (oi + 1)}　${cleanMath(opt)}`, style: 'Normal' });
        });
        model.push({ text: '　答え（　　）', style: 'Normal' });
      } else if (!isCalc) {
        const lineCount = q.answerLength === 'long' ? 4 : 2;
        for (let l = 0; l < lineCount; l++) model.push({ text: '　', style: 'Blank' });
      }
    });

    if (opts.includeAnswerSheet) {
      model.push({ text: '解答・採点基準（教員用）', style: 'AnswerHeading', pageBreak: true });
      questions.forEach((q, i) => {
        model.push({ text: `問${i + 1}　${cleanMath(q.answer)}`, style: 'AnswerBold' });
        if (q.explanation) model.push({ text: cleanMath(q.explanation), style: 'Meta' });
      });
    }
    return model;
  }

  async function buildDocxBlob(model){
    const { Document, Packer, Paragraph, TextRun, BorderStyle } = window.docx;
    const STYLE = {
      Title: { bold: true, size: 36 },
      Meta: { size: 18, color: '555555' },
      Score: { bold: true, size: 22 },
      Normal: { size: 22 },
      Question: { bold: true, size: 24 },
      AnswerHeading: { bold: true, size: 28 },
      AnswerBold: { bold: true, size: 22 },
      Blank: { size: 22 }
    };
    const children = model.map(item => {
      const def = STYLE[item.style] || {};
      const p = {
        children: [ new TextRun({ text: item.text, ...def }) ],
        spacing: { after: item.style === 'Title' ? 80 : 140 }
      };
      if (item.pageBreak) p.pageBreakBefore = true;
      if (item.style === 'Blank') p.border = { bottom: { style: BorderStyle.SINGLE, size: 4, color: '999999' } };
      if (item.style === 'AnswerHeading') p.border = { bottom: { style: BorderStyle.SINGLE, size: 8, color: '000000' } };
      return new Paragraph(p);
    });
    const doc = new Document({
      sections: [{ properties: {}, children }],
      styles: { default: { document: { run: { font: 'Kaisei Decol' } } } }
    });
    return await Packer.toBlob(doc);
  }

  function escapeXml(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  async function buildOdtBlob(model){
    const stylesXml = `
      <style:style style:name="Title" style:family="paragraph"><style:text-properties fo:font-size="18pt" fo:font-weight="bold"/></style:style>
      <style:style style:name="Meta" style:family="paragraph"><style:text-properties fo:font-size="9pt" fo:color="#555555"/></style:style>
      <style:style style:name="Score" style:family="paragraph"><style:text-properties fo:font-size="12pt" fo:font-weight="bold"/></style:style>
      <style:style style:name="Normal" style:family="paragraph"><style:text-properties fo:font-size="11pt"/></style:style>
      <style:style style:name="Question" style:family="paragraph"><style:text-properties fo:font-size="12pt" fo:font-weight="bold"/><style:paragraph-properties fo:margin-top="0.3cm"/></style:style>
      <style:style style:name="AnswerHeading" style:family="paragraph"><style:text-properties fo:font-size="14pt" fo:font-weight="bold"/><style:paragraph-properties fo:break-before="page" fo:border-bottom="1pt solid #000000"/></style:style>
      <style:style style:name="AnswerBold" style:family="paragraph"><style:text-properties fo:font-size="11pt" fo:font-weight="bold"/></style:style>
      <style:style style:name="Blank" style:family="paragraph"><style:paragraph-properties fo:border-bottom="0.5pt solid #999999" fo:margin-bottom="0.3cm"/></style:style>
    `;
    const bodyXml = model.map(item => `<text:p text:style-name="${item.style}">${escapeXml(item.text)}</text:p>`).join('\n');
    const contentXml = `<?xml version="1.0" encoding="UTF-8"?>
<office:document-content xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0" xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0" xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0" xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0" office:version="1.2">
<office:automatic-styles>${stylesXml}</office:automatic-styles>
<office:body><office:text>${bodyXml}</office:text></office:body>
</office:document-content>`;
    const manifestXml = `<?xml version="1.0" encoding="UTF-8"?>
<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2">
 <manifest:file-entry manifest:full-path="/" manifest:version="1.2" manifest:media-type="application/vnd.oasis.opendocument.text"/>
 <manifest:file-entry manifest:full-path="content.xml" manifest:media-type="text/xml"/>
</manifest:manifest>`;

    const zip = new window.JSZip();
    zip.file('mimetype', 'application/vnd.oasis.opendocument.text', { compression: 'STORE' });
    zip.folder('META-INF').file('manifest.xml', manifestXml);
    zip.file('content.xml', contentXml);
    return await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.oasis.opendocument.text' });
  }

  async function exportPng(){
    const paperEl = paperArea.querySelector('.paper-page');
    if (!paperEl) return;
    const canvas = await window.html2canvas(paperEl, { backgroundColor: '#ffffff', scale: 2 });
    await new Promise(resolve => {
      canvas.toBlob(blob => {
        const fname = `${(lastOpts.subject || 'テスト')}_${(lastOpts.grade || '')}.png`.replace(/\s+/g, '');
        downloadBlob(blob, fname);
        resolve();
      });
    });
  }

  function fileBaseName(){
    return `${(lastOpts.subject || 'テスト')}_${(lastOpts.grade || '')}`.replace(/\s+/g, '');
  }

  docxBtn.addEventListener('click', async () => {
    if (!window.docx) { showStatus('Wordファイル生成用ライブラリの読み込みに失敗しました。通信環境をご確認のうえページを再読み込みしてください。', true); return; }
    if (!lastQuestions) return;
    docxBtn.disabled = true;
    try {
      const model = buildContentModel(lastQuestions, lastOpts);
      const blob = await buildDocxBlob(model);
      downloadBlob(blob, fileBaseName() + '.docx');
    } catch (err) {
      console.error(err);
      showStatus('Wordファイルの作成に失敗しました。', true);
    } finally {
      docxBtn.disabled = false;
    }
  });

  odtBtn.addEventListener('click', async () => {
    if (!window.JSZip) { showStatus('LibreOfficeファイル生成用ライブラリの読み込みに失敗しました。通信環境をご確認のうえページを再読み込みしてください。', true); return; }
    if (!lastQuestions) return;
    odtBtn.disabled = true;
    try {
      const model = buildContentModel(lastQuestions, lastOpts);
      const blob = await buildOdtBlob(model);
      downloadBlob(blob, fileBaseName() + '.odt');
    } catch (err) {
      console.error(err);
      showStatus('LibreOfficeファイルの作成に失敗しました。', true);
    } finally {
      odtBtn.disabled = false;
    }
  });

  pngBtn.addEventListener('click', async () => {
    if (!window.html2canvas) { showStatus('PNG生成用ライブラリの読み込みに失敗しました。通信環境をご確認のうえページを再読み込みしてください。', true); return; }
    if (!lastQuestions) return;
    pngBtn.disabled = true;
    try {
      await exportPng();
    } catch (err) {
      console.error(err);
      showStatus('PNG画像の作成に失敗しました。', true);
    } finally {
      pngBtn.disabled = false;
    }
  });

  printBtn.addEventListener('click', () => window.print());
})();
</script>
