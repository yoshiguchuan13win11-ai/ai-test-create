<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 問題演習ノート — Gemini製 テスト問題ジェネレーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --desk: #3a2c20;
    --desk-dark: #2c2118;
    --paper: #f7f2e6;
    --paper-edge: #ece4d0;
    --line: #d8cdb0;
    --ink: #232a3a;
    --ink-soft: #5c6274;
    --red: #b23a2e;
    --red-dark: #8a2b21;
    --red-soft: rgba(178,58,46,0.08);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(255,255,255,0.04), transparent 60%),
      repeating-linear-gradient(90deg, var(--desk) 0px, var(--desk) 3px, var(--desk-dark) 3px, var(--desk-dark) 6px);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color: var(--ink);
    padding: 48px 16px 80px;
    display:flex;
    justify-content:center;
  }

  .sheet{
    position:relative;
    width:100%;
    max-width: 760px;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      repeating-linear-gradient(0deg, transparent 0px, transparent 35px, var(--line) 35px, var(--line) 36px);
    background-color: var(--paper);
    border-radius: 2px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 2px 0 var(--paper-edge);
    padding: 44px 40px 56px 74px;
    transform: rotate(-0.4deg);
  }
  .sheet::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:52px;
    width:2px;
    background: rgba(178,58,46,0.35);
  }
  .sheet::after{
    content:"";
    position:absolute;
    top:14px; right:26px;
    width:34px; height:34px;
    background: repeating-radial-gradient(circle at center, #cfc4a3 0 2px, transparent 2px 100%);
    opacity:.5;
    border-radius:50%;
  }

  header{ margin-bottom: 30px; }
  .eyebrow{
    font-family:'Courier Prime', monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: var(--red);
    text-transform: uppercase;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight: 800;
    font-size: clamp(26px, 4.4vw, 34px);
    margin: 6px 0 8px;
    line-height:1.3;
  }
  header p{
    margin:0;
    color: var(--ink-soft);
    font-size: 14px;
    line-height:1.7;
  }

  fieldset{ border:none; margin:0 0 22px; padding:0; }
  .field{ margin-bottom: 16px; }
  .field label{
    display:block;
    font-size: 12.5px;
    font-weight:700;
    color: var(--red-dark);
    margin-bottom: 6px;
  }
  .field label .req{ font-weight:400; color: var(--ink-soft); margin-left: 4px; }
  .field input[type=number],
  .field select,
  .field textarea{
    width:100%;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--line);
    padding: 8px 2px;
    outline: none;
    transition: border-color .15s ease;
  }
  .field textarea{ resize: vertical; min-height: 54px; line-height:1.6; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-bottom-color: var(--red); }
  .row{ display:flex; gap: 20px; flex-wrap: wrap; }
  .row .field{ flex:1 1 160px; }

  .stamp-btn{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:17px;
    letter-spacing: 0.08em;
    color: #fdf6ee;
    background: var(--red);
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor:pointer;
    box-shadow: 0 6px 0 var(--red-dark), 0 10px 18px rgba(178,58,46,0.35);
    transform: rotate(-2deg);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .stamp-btn:hover{ transform: rotate(-2deg) translateY(-1px); }
  .stamp-btn:active{
    transform: rotate(-2deg) translateY(4px);
    box-shadow: 0 2px 0 var(--red-dark), 0 4px 8px rgba(178,58,46,0.3);
  }
  .stamp-btn:disabled{ opacity:.55; cursor: default; transform:none; box-shadow: 0 4px 0 var(--red-dark); }
  .btn-wrap{ display:flex; align-items:center; gap:16px; margin: 6px 0 8px; flex-wrap:wrap; }
  .status-msg{ font-size: 13px; color: var(--ink-soft); }
  .status-msg.error{ color: var(--red-dark); font-weight:700; }

  .loading-line{ display:none; align-items:center; gap:10px; font-family:'Courier Prime', monospace; font-size: 13px; color: var(--ink-soft); }
  .loading-line.active{ display:flex; }
  .pencil-track{ position:relative; width:120px; height:2px; background: var(--line); overflow:hidden; border-radius:2px; }
  .pencil-track::after{
    content:""; position:absolute; top:0; left:-40%; width:40%; height:100%;
    background: var(--red); animation: scribble 1.1s ease-in-out infinite;
  }
  @keyframes scribble{ 0%{ left:-40%; } 50%{ left:100%; } 100%{ left:-40%; } }

  .results{ margin-top: 30px; display:flex; flex-direction:column; gap: 26px; }
  .qcard{ position:relative; border-top: 1px solid var(--line); padding-top: 20px; }
  .qhead{ display:flex; gap: 14px; align-items:flex-start; }
  .qnum{
    flex: none; width: 34px; height:34px; border-radius: 50%;
    border: 2px solid var(--red); color: var(--red-dark);
    font-family:'Courier Prime', monospace; font-weight:700; font-size: 14px;
    display:flex; align-items:center; justify-content:center;
    transform: rotate(-4deg);
  }
  .qbody{ flex:1; }
  .qtype{
    display:inline-block; font-family:'Courier Prime', monospace; font-size: 10.5px;
    letter-spacing:0.08em; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 3px; padding: 1px 6px; margin-bottom: 6px;
  }
  .qtext{ font-size: 16px; line-height:1.75; margin: 0 0 12px; }
  .options{ list-style:none; margin:0 0 14px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .options li{ display:flex; align-items:baseline; gap:10px; font-size: 14.5px; line-height:1.6; padding: 2px 0; }
  .options li .bullet{ flex:none; font-family:'Courier Prime', monospace; color: var(--ink-soft); font-size:13px; }
  .options li.correct{ color: var(--red-dark); font-weight:700; }
  .options li.correct .bullet{ color: var(--red-dark); }

  .reveal-btn{
    font-family:'Zen Kaku Gothic New', sans-serif; font-size: 13px; font-weight:700;
    color: var(--red-dark); background: transparent; border: 1px solid var(--red);
    border-radius: 999px; padding: 6px 16px; cursor:pointer;
    transition: background .12s ease, color .12s ease;
  }
  .reveal-btn:hover{ background: var(--red); color: #fff; }

  .answer-block{
    display:none; position:relative; margin-top: 16px; padding: 16px 18px 16px 20px;
    background: rgba(178,58,46,0.05); border-left: 3px solid var(--red); border-radius: 0 6px 6px 0;
  }
  .answer-block.show{ display:block; animation: ink-in .28s ease; }
  @keyframes ink-in{ from{ opacity:0; transform: translateY(-4px); } to{ opacity:1; transform: translateY(0); } }
  .stamp{
    position:absolute; top:-14px; right:10px; width:64px; height:64px;
    display:flex; align-items:center; justify-content:center;
    border: 3px solid var(--red); border-radius:50%; color: var(--red);
    font-family:'Shippori Mincho', serif; font-weight:800; font-size: 13px; letter-spacing:0.05em;
    transform: rotate(-14deg) scale(0); background: rgba(247,242,230,0.85);
    animation: stamp-in .32s cubic-bezier(.36,1.4,.5,1) forwards; animation-delay: .05s;
  }
  @keyframes stamp-in{ to{ transform: rotate(-14deg) scale(1); } }
  .answer-label{ font-family:'Courier Prime', monospace; font-size: 11px; letter-spacing:0.1em; color: var(--red-dark); margin: 0 0 4px; }
  .answer-text{ font-size: 15px; font-weight:700; margin: 0 0 10px; line-height:1.6; }
  .explanation{ font-size: 13.5px; color: var(--ink-soft); line-height:1.75; margin:0; }

  .empty-note{ margin-top: 30px; padding: 22px 4px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13.5px; line-height:1.8; }
  footer{ margin-top: 40px; padding-top: 16px; border-top: 1px dashed var(--line); font-size: 11.5px; color: var(--ink-soft); font-family:'Courier Prime', monospace; }

  @media (max-width: 520px){
    .sheet{ padding: 36px 20px 44px 46px; }
    .sheet::before{ left: 26px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <div class="eyebrow">Gemini API / サーバー側でキーを保護</div>
    <h1>AI 問題演習ノート</h1>
    <p>テーマと形式を書き込むと、Gemini が問題と解答・解説を作成します。APIキーはサーバー側（Vercelの環境変数）だけで使われ、この画面には一切表示されません。</p>
  </header>

  <form id="genForm">
    <fieldset>
      <div class="field">
        <label for="topic">出題テーマ <span class="req">必須</span></label>
        <textarea id="topic" placeholder="例：中学2年 理科「電流とオームの法則」、英検準2級レベルの語彙、Reactのフック（useState / useEffect）など"></textarea>
      </div>

      <div class="row">
        <div class="field">
          <label for="format">問題形式</label>
          <select id="format">
            <option value="mixed">選択式・記述式を混在</option>
            <option value="mc">選択式（4択）のみ</option>
            <option value="desc">記述式のみ</option>
          </select>
        </div>
        <div class="field">
          <label for="difficulty">難易度</label>
          <select id="difficulty">
            <option value="easy">やさしい</option>
            <option value="normal" selected>標準</option>
            <option value="hard">難しい</option>
          </select>
        </div>
        <div class="field">
          <label for="count">問題数</label>
          <input type="number" id="count" value="5" min="1" max="15">
        </div>
      </div>
    </fieldset>

    <div class="btn-wrap">
      <button type="submit" class="stamp-btn" id="genBtn">問題を作成する</button>
      <div class="loading-line" id="loadingLine">
        <span class="pencil-track"></span>
        <span>生成中…</span>
      </div>
      <span class="status-msg" id="statusMsg"></span>
    </div>
  </form>

  <div class="results" id="results"></div>

  <div class="empty-note" id="emptyNote">
    まだ問題は作成されていません。テーマを書き込んで「問題を作成する」を押してください。
  </div>

  <footer>note: Gemini API により生成 — 内容の正確性は必ず確認してください</footer>
</div>

<script>
(function(){
  const form = document.getElementById('genForm');
  const topicInput = document.getElementById('topic');
  const formatSelect = document.getElementById('format');
  const difficultySelect = document.getElementById('difficulty');
  const countInput = document.getElementById('count');
  const genBtn = document.getElementById('genBtn');
  const loadingLine = document.getElementById('loadingLine');
  const statusMsg = document.getElementById('statusMsg');
  const resultsEl = document.getElementById('results');
  const emptyNote = document.getElementById('emptyNote');

  function setLoading(isLoading) {
    genBtn.disabled = isLoading;
    loadingLine.classList.toggle('active', isLoading);
  }

  function showStatus(text, isError) {
    statusMsg.textContent = text || '';
    statusMsg.classList.toggle('error', !!isError);
  }

  function letterFor(i) {
    return ['A', 'B', 'C', 'D', 'E', 'F'][i] || (i + 1);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderResults(items) {
    resultsEl.innerHTML = '';
    if (!items || !items.length) {
      emptyNote.style.display = 'block';
      emptyNote.textContent = '問題が生成されませんでした。テーマを変えて再度お試しください。';
      return;
    }
    emptyNote.style.display = 'none';

    items.forEach((item, idx) => {
      const card = document.createElement('div');
      card.className = 'qcard';

      const isMC = item.type === 'multiple_choice' && Array.isArray(item.options) && item.options.length > 0;

      let optionsHtml = '';
      if (isMC) {
        optionsHtml = '<ul class="options">' + item.options.map((opt, i) => {
          const isCorrect = String(opt).trim() === String(item.answer).trim();
          return `<li class="opt-item" data-correct="${isCorrect}"><span class="bullet">${letterFor(i)}</span><span>${escapeHtml(opt)}</span></li>`;
        }).join('') + '</ul>';
      }

      card.innerHTML = `
        <div class="qhead">
          <div class="qnum">${idx + 1}</div>
          <div class="qbody">
            <span class="qtype">${isMC ? '選択式' : '記述式'}</span>
            <p class="qtext">${escapeHtml(item.question)}</p>
            ${optionsHtml}
            <button type="button" class="reveal-btn">解答を見る</button>
            <div class="answer-block">
              <div class="stamp">正解</div>
              <p class="answer-label">ANSWER</p>
              <p class="answer-text">${escapeHtml(item.answer)}</p>
              <p class="explanation">${escapeHtml(item.explanation || '')}</p>
            </div>
          </div>
        </div>
      `;

      const revealBtn = card.querySelector('.reveal-btn');
      const answerBlock = card.querySelector('.answer-block');
      revealBtn.addEventListener('click', () => {
        const willShow = !answerBlock.classList.contains('show');
        answerBlock.classList.toggle('show', willShow);
        revealBtn.textContent = willShow ? '解答をかくす' : '解答を見る';
        if (willShow && isMC) {
          card.querySelectorAll('.opt-item').forEach(li => {
            if (li.getAttribute('data-correct') === 'true') li.classList.add('correct');
          });
        }
      });

      resultsEl.appendChild(card);
    });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    showStatus('');

    const topic = topicInput.value.trim();
    const format = formatSelect.value;
    const difficulty = difficultySelect.value;
    const count = Math.min(15, Math.max(1, parseInt(countInput.value, 10) || 5));

    if (!topic) { showStatus('出題テーマを入力してください。', true); topicInput.focus(); return; }

    setLoading(true);

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ topic, format, difficulty, count })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || `サーバーエラー (${res.status})`);
      }

      renderResults(data.items);
      showStatus(`${data.items.length}問 作成しました。`);
    } catch (err) {
      console.error(err);
      showStatus(err.message || '問題の作成に失敗しました。', true);
    } finally {
      setLoading(false);
    }
  });
})();
</script>

</body>
</html>
